<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rosa</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #02010a;
    font-family: 'Segoe UI', sans-serif;
  }
  canvas { display: block; }
  #hint {
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255, 220, 230, 0.75);
    font-size: 13px; letter-spacing: 1px;
    text-align: center; pointer-events: none;
    text-shadow: 0 0 10px rgba(255, 120, 160, 0.6);
    animation: fadeHint 8s ease-in-out forwards;
    z-index: 5;
  }
  @keyframes fadeHint {
    0%, 70% { opacity: 0.9; }
    100% { opacity: 0; }
  }
  #loading {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #02010a; color: #ff85a1; z-index: 10;
    font-size: 1.3rem; letter-spacing: 2px;
    transition: opacity .8s;
  }
  #loading .dot {
    display: inline-block; animation: bounce 1.2s infinite;
    margin: 0 3px; color: #ffd54f;
  }
  #loading .dot:nth-child(2) { animation-delay: .15s; }
  #loading .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-10px); }
  }
  .hidden { opacity: 0; pointer-events: none; }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="loading">cargando<span class="dot">.</span><span class="dot">.</span><span class="dot"></span></div>
<div id="hint"> &nbsp;·&nbsp; </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls }   from 'three/addons/controls/OrbitControls.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ============================================================
//   ESCENA · CÁMARA · RENDERER
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02010a);
scene.fog = new THREE.FogExp2(0x02010a, 0.028);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.up.set(0, 0, 1);           // usamos Z como "arriba"
camera.position.set(2.2, -3.2, 1.3);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.75;    // ← corregido: antes 1.1
document.body.appendChild(renderer.domElement);

// ============================================================
//   CONTROLES (mouse / touch)
// ============================================================
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, -0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance   = 1.8;
controls.maxDistance   = 11;
controls.maxPolarAngle = Math.PI * 0.85;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.5;
controls.update();

// ============================================================
//   LUCES
// ============================================================
scene.add(new THREE.AmbientLight(0x3a3050, 1.4));

const keyLight = new THREE.DirectionalLight(0xffd9b0, 2.4);
keyLight.position.set(3, -5, 6);
scene.add(keyLight);

const rimLight = new THREE.DirectionalLight(0x8090ff, 1.6);
rimLight.position.set(-4, 3, 2);
scene.add(rimLight);

const innerGlow = new THREE.PointLight(0xff4060, 1.8, 2.0);   // ← corregido: antes 4 / 3.5
innerGlow.position.set(0, 0, 0.45);
scene.add(innerGlow);

// ============================================================
//   GEOMETRÍA DE PÉTALOS
// ============================================================
function pushPetal(positions, colors, indices, rgb, scale, tilt, yaw, roll, tz) {
  const nu = 14, nv = 14;
  const start = positions.length / 3;
  const cr = Math.cos(roll), sr = Math.sin(roll);
  const ct = Math.cos(tilt), st = Math.sin(tilt);
  const cy = Math.cos(yaw),  sy = Math.sin(yaw);

  for (let i = 0; i < nu; i++) {
    const u = i / (nu - 1);
    for (let j = 0; j < nv; j++) {
      const v = -1 + 2 * j / (nv - 1);
      const width = Math.pow(Math.sin(Math.PI * Math.pow(u, 0.75)), 0.55);

      const px = u;
      const py = v * width * 0.7;
      const pz = 0.28 * (v*v) * width + 0.42 * u*u + 0.22 * u*u*u
               + 0.025 * Math.sin(6 * Math.PI * u) * (1 - v*v);

      const y1 = py*cr - pz*sr;
      const z1 = py*sr + pz*cr;
      const x2 = px*ct + z1*st;
      const z2 = -px*st + z1*ct;
      const x3 = x2*cy - y1*sy;
      const y3 = x2*sy + y1*cy;

      positions.push(x3 * scale, y3 * scale, z2 * scale + tz);

      const g = 0.55 + 0.55 * u;
      colors.push(rgb[0]*g, rgb[1]*g, rgb[2]*g);
    }
  }

  for (let i = 0; i < nu - 1; i++) {
    for (let j = 0; j < nv - 1; j++) {
      const a = start + i * nv + j;
      const b = start + (i + 1) * nv + j;
      const c = start + (i + 1) * nv + (j + 1);
      const d = start + i * nv + (j + 1);
      indices.push(a, b, d, b, c, d);
    }
  }
}

function buildRose() {
  const positions = [];
  const colors = [];
  const indices = [];

  const layers = [
    [10, 0.72, -0.18, -0.10, [0.16, 0.02, 0.02]],
    [ 9, 0.62, -0.35,  0.00, [0.34, 0.01, 0.03]],
    [ 8, 0.52, -0.55,  0.10, [0.54, 0.01, 0.05]],
    [ 7, 0.43, -0.75,  0.22, [0.70, 0.02, 0.08]],
    [ 6, 0.35, -0.95,  0.34, [0.84, 0.04, 0.11]],
    [ 5, 0.28, -1.15,  0.45, [0.94, 0.07, 0.16]],
    [ 4, 0.21, -1.32,  0.54, [1.00, 0.22, 0.30]],
    [ 3, 0.14, -1.45,  0.62, [1.00, 0.50, 0.60]],
  ];

  for (let li = 0; li < layers.length; li++) {
    const [count, scale, tiltB, zoff, rgb] = layers[li];
    for (let i = 0; i < count; i++) {
      const yaw  = 2 * Math.PI * i / count + li * 0.47;
      const tilt = tiltB + 0.07 * Math.sin(i * 2.1 + li * 1.3);
      const roll = 0.13 * Math.cos(i * 1.7 + li * 0.6) + 0.05 * li;
      pushPetal(positions, colors, indices, rgb, scale, tilt, yaw, roll, zoff);
    }
  }

  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geom.setAttribute('color',    new THREE.Float32BufferAttribute(colors, 3));
  geom.setIndex(indices);
  geom.computeVertexNormals();
  return geom;
}

const roseMat = new THREE.MeshStandardMaterial({
  vertexColors: true,
  roughness: 0.62,
  metalness: 0.15,
  side: THREE.DoubleSide,
  flatShading: false,
  emissive: new THREE.Color(0x2a0008),
  emissiveIntensity: 0.15,     // ← corregido: antes 0.6
});
const roseMesh = new THREE.Mesh(buildRose(), roseMat);
scene.add(roseMesh);

// ============================================================
//   TALLO
// ============================================================
const stemCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0.00,  0.00, -0.05),
  new THREE.Vector3( 0.05, -0.02, -0.80),
  new THREE.Vector3( 0.09, -0.04, -1.50),
  new THREE.Vector3( 0.06, -0.06, -2.20),
  new THREE.Vector3( 0.00, -0.07, -2.55),
]);
const stemGeom = new THREE.TubeGeometry(stemCurve, 60, 0.05, 10, false);
const stemMat  = new THREE.MeshStandardMaterial({
  color: 0x1e3d10, roughness: 0.85, metalness: 0.05,
});
const stemMesh = new THREE.Mesh(stemGeom, stemMat);
scene.add(stemMesh);

// ============================================================
//   HOJAS
// ============================================================
function leafGeom(scale) {
  const nu = 10, nv = 10;
  const positions = [];
  const indices = [];
  for (let i = 0; i < nu; i++) {
    const u = i / (nu - 1);
    for (let j = 0; j < nv; j++) {
      const v = -1 + 2 * j / (nv - 1);
      const width = Math.pow(Math.sin(Math.PI * u), 0.7);
      const x = u * scale;
      const y = v * width * scale;
      const z = (0.12*u*u - 0.08*v*v + 0.05*Math.sin(3*Math.PI*u)) * scale;
      positions.push(x, y, z);
    }
  }
  for (let i = 0; i < nu - 1; i++) {
    for (let j = 0; j < nv - 1; j++) {
      const a = i * nv + j;
      const b = (i + 1) * nv + j;
      const c = (i + 1) * nv + (j + 1);
      const d = i * nv + (j + 1);
      indices.push(a, b, d, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(indices);
  g.computeVertexNormals();
  return g;
}

const leafMat = new THREE.MeshStandardMaterial({
  color: 0x2f6b1a, roughness: 0.75, metalness: 0.05,
  side: THREE.DoubleSide,
});

const leafSpecs = [
  { pos: 0.30, yaw: 0.6, pitch: -0.25, roll:  0.30, scale: 1.00 },
  { pos: 0.55, yaw: 3.7, pitch: -0.20, roll: -0.30, scale: 0.90 },
  { pos: 0.78, yaw: 2.1, pitch: -0.30, roll:  0.20, scale: 0.70 },
];

for (const spec of leafSpecs) {
  const base = stemCurve.getPoint(spec.pos);
  const leaf = new THREE.Mesh(leafGeom(spec.scale), leafMat);
  leaf.position.copy(base);
  leaf.rotation.set(spec.pitch, spec.yaw, spec.roll);
  scene.add(leaf);
}

// ============================================================
//   LUCIÉRNAGAS (shader corregido · puntos pequeños y elegantes)
// ============================================================
const FF_COUNT = 90;    // ← corregido: antes 140
const ffPos    = new Float32Array(FF_COUNT * 3);
const ffPhase  = new Float32Array(FF_COUNT);
const ffSpeed  = new Float32Array(FF_COUNT);

for (let i = 0; i < FF_COUNT; i++) {
  const th = Math.random() * 2 * Math.PI;
  const ph = -0.6 + Math.random() * 1.6;
  const r  = 0.7 + Math.random() * 2.0;
  ffPos[i*3    ] = r * Math.cos(ph) * Math.cos(th);
  ffPos[i*3 + 1] = r * Math.cos(ph) * Math.sin(th);
  ffPos[i*3 + 2] = r * Math.sin(ph) + 0.2;
  ffPhase[i] = Math.random() * 2 * Math.PI;
  ffSpeed[i] = 0.6 + Math.random() * 1.7;
}

const ffGeom = new THREE.BufferGeometry();
ffGeom.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
ffGeom.setAttribute('phase',    new THREE.BufferAttribute(ffPhase, 1));
ffGeom.setAttribute('speed',    new THREE.BufferAttribute(ffSpeed, 1));

const ffUniforms = {
  time:  { value: 0 },
  color: { value: new THREE.Color(0xffd94a) },
};

const ffMat = new THREE.ShaderMaterial({
  uniforms: ffUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexShader: /* glsl */`
    attribute float phase;
    attribute float speed;
    uniform float time;
    varying float vAlpha;

    void main() {
      vec3 pos = position;
      pos.x += 0.15 * sin(speed * time * 0.4 + phase);
      pos.y += 0.15 * cos(speed * time * 0.3 + phase * 1.3);
      pos.z += 0.10 * sin(speed * time * 0.5 + phase * 0.7);

      vec4 mv = modelViewMatrix * vec4(pos, 1.0);

      // Tamaño correcto en píxeles + límite duro de 22 px
      float psize = 26.0 / -mv.z;
      gl_PointSize = clamp(psize, 1.5, 22.0);

      gl_Position = projectionMatrix * mv;

      float pulse = 0.5 + 0.5 * sin(speed * time + phase);
      vAlpha = pow(pulse, 1.8);
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 color;
    varying float vAlpha;
    void main() {
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      float halo = smoothstep(0.5, 0.0, d);
      float core = smoothstep(0.14, 0.0, d);
      float a = halo * 0.55 + core * 0.95;
      gl_FragColor = vec4(color, a * vAlpha);
    }
  `,
});
scene.add(new THREE.Points(ffGeom, ffMat));

// ============================================================
//   POLVO MÁGICO Y ESTRELLAS
// ============================================================
function buildPoints(count, radiusMin, radiusMax, color, size, opacity, avoidCenter = false) {
  const pos = new Float32Array(count * 3);
  let n = 0;
  while (n < count) {
    const x = (Math.random() - 0.5) * radiusMax * 2;
    const y = (Math.random() - 0.5) * radiusMax * 2;
    const z = (Math.random() - 0.5) * radiusMax * 2;
    if (avoidCenter && Math.abs(x) < radiusMin && Math.abs(y) < radiusMin && z > -0.6 && z < 1.0) continue;
    pos[n*3] = x; pos[n*3+1] = y; pos[n*3+2] = z;
    n++;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const m = new THREE.PointsMaterial({
    color, size, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false,
    sizeAttenuation: true,
  });
  return new THREE.Points(g, m);
}

// polvo azulado flotando cerca
const dust = buildPoints(240, 0.9, 3.0, 0xc0d4ff, 0.02, 0.5, true);
scene.add(dust);

// estrellas lejanas
const stars = buildPoints(500, 0, 8.0, 0xffffff, 0.025, 0.7);
const sPos = stars.geometry.attributes.position.array;
for (let i = 0; i < sPos.length; i += 3) {
  const r = Math.hypot(sPos[i], sPos[i+1], sPos[i+2]);
  if (r < 4) {
    const k = 5 / r;
    sPos[i] *= k; sPos[i+1] *= k; sPos[i+2] *= k;
  }
}
stars.geometry.attributes.position.needsUpdate = true;
scene.add(stars);

// ============================================================
//   BLOOM (ahora suave y selectivo)
// ============================================================
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight),
  0.55,   // ← strength: antes 0.95
  0.35,   // ← radius: antes 0.55
  0.65    // ← threshold: antes 0.20
);
composer.addPass(bloom);

// ============================================================
//   RESIZE
// ============================================================
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ============================================================
//   LOOP DE ANIMACIÓN
// ============================================================
const clock = new THREE.Clock();

function animate() {
  const t = clock.getElapsedTime();
  ffUniforms.time.value = t;

  // respiración sutil del brillo central (mucho más suave)
  innerGlow.intensity = 1.6 + 0.5 * Math.sin(t * 1.3);   // ← antes 3.2 + 1.2

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}
animate();

// Ocultar el loader una vez que todo cargó
setTimeout(() => {
  document.getElementById('loading').classList.add('hidden');
}, 400);
</script>
</body>
</html>
